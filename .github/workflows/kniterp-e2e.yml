name: knitERP e2e (Playwright)

# Сквозные тесты модуля «Сотрудники» в браузере: приложение на чистой базе SQL Server, вход Владельца с 2FA.
# Отдельный файл, чтобы не менять общий kniterp.yml. Сторонние действия закреплены по SHA (D109).
on:
  push:
    paths:
      - "kniterp/**"
      - ".github/workflows/kniterp-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kniterp-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kniterp

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Одноразовый контейнер только для тестов CI, не секрет рабочей среды.
          MSSQL_SA_PASSWORD: "Ci_Only_Pa55w0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_Only_Pa55w0rd!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      KNITERP_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=Ci_Only_Pa55w0rd!;TrustServerCertificate=true;Encrypt=false"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore (locked) and build
        run: |
          dotnet restore KnitErp.slnx --locked-mode
          dotnet build KnitErp.slnx --no-restore

      - name: HTTPS development certificate
        run: dotnet dev-certs https

      - name: Playwright (locked versions)
        working-directory: kniterp/tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: kniterp/tests/e2e
        run: npx playwright test

      - name: Traces of failed tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: kniterp/tests/e2e/test-results
          retention-days: 7
